name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    needs: review-core
    name: Frontend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Knip
            command: npm run knip
          - name: Format
            command: npm run format:check
          - name: Test
            command: npm run test:run
          - name: Build
            command: npm run build

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: review-wasm
          path: src/review/generated
      - run: npm ci
      - run: ${{ matrix.command }}

  backend:
    name: Backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt -- --check
          - name: Clippy
            command: cargo clippy --locked --all-targets -- -D warnings
          - name: Test
            command: cargo test --locked

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: ${{ matrix.command }}

  review-core:
    name: Review core and interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spikes/automerge/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: npm ci --prefix spikes/automerge
      - run: npx --prefix spikes/automerge playwright install --with-deps chromium
      - run: npm test --prefix spikes/automerge
      - run: node scripts/review-wasm.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: review-wasm
          path: src/review/generated

  review-browser:
    needs: review-core
    name: Review feature / offline browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: review-wasm
          path: src/review/generated
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:review:e2e

  api-schema:
    name: API schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run api:check
