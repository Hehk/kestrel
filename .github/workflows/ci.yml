name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Typecheck
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Format
            command: npm run format:check
          - name: Test
            command: npm run test:run
          - name: Build
            command: npm run build

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: ${{ matrix.command }}

  backend:
    name: Backend / ${{ matrix.name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: cargo fmt -- --check
          - name: Clippy
            command: cargo clippy --locked --all-targets -- -D warnings
          - name: Test
            command: cargo test --locked

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: ${{ matrix.command }}

  api-schema:
    name: API schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run api:check
