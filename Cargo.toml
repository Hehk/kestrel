[workspace]
members = ["crates/review-core", "crates/review-wasm"]
exclude = ["backend"]
resolver = "2"

[workspace.dependencies]
automerge = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.128"

[profile.release]
opt-level = "s"
lto = true
